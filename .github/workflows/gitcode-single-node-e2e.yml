name: MMC and MemFabric single-node E2E
on:
  push:
    branches: [ci/verify-gitcode-single-node-20261124]
permissions: {}
jobs:
  device:
    name: A5 CANN device setup around nightly wheel installation
    runs-on: linux-amd64-a5-mooncake-fed-2
    timeout-minutes: 20
    container:
      image: swr.cn-southwest-2.myhuaweicloud.com/base_image/ascend-ci/vllm-ascend:v0.30.0-a5@sha256:646cb4f046192fbf8e3fd246891ea60d1936d418a0635c6e83a2e599016b2ff3
    defaults:
      run:
        shell: bash
    steps:
      - name: Compare CANN device setup before and after installing the new packages
        run: |
          set -eo pipefail
          export ASCEND_GLOBAL_LOG_LEVEL=3 ASCEND_SLOG_PRINT_TO_STDOUT=1
          git init -q cases
          git -C cases fetch -q --depth=1 https://gitcode.com/ffmeng/MemcacheTestYellowToBlue.git refs/heads/ci/github-single-node-swr
          git -C cases checkout -q --detach FETCH_HEAD
          cd cases
          python3 -m pip install --no-build-isolation -e . --index-url https://repo.huaweicloud.com/repository/pypi/simple
          python3 scripts/prepare_ci_wheels.py --source nightly --output-dir "$RUNNER_TEMP/wheels"
          source "$(python3 -c 'from libs.utils.container_env import find_ascend_script; print(find_ascend_script())')"
          cat > "$RUNNER_TEMP/probe.py" <<'PY'
          import ctypes
          lib = ctypes.CDLL("libascendcl.so")
          rc = lib.aclInit(None)
          print("aclInit", rc, flush=True)
          if rc:
              raise SystemExit(1)
          rc = lib.aclrtSetDevice(0)
          print("aclrtSetDevice(0)", rc, flush=True)
          if rc == 0:
              print("aclrtResetDevice(0)", lib.aclrtResetDevice(0), flush=True)
          lib.aclFinalize()
          raise SystemExit(int(rc != 0))
          PY
          echo 'Phase 1: CANN baseline'
          timeout --kill-after=5s 180s python3 -u "$RUNNER_TEMP/probe.py"
          python3 -m pip install --force-reinstall --no-deps "$RUNNER_TEMP"/wheels/*.whl
          echo 'Phase 2: nightly wheels installed'
          timeout --kill-after=5s 180s python3 -u "$RUNNER_TEMP/probe.py"
          site=$(python3 -c 'import sysconfig; print(sysconfig.get_path("purelib"))')
          export LD_LIBRARY_PATH="$site/memfabric_hybrid/lib:$site/memcache_hybrid/lib:${LD_LIBRARY_PATH:-}"
          ASCEND_SLOG_PRINT_TO_STDOUT=0 mfcli kernel install --soc-version A5
          echo 'Phase 3: nightly A5 device operators installed'
          timeout --kill-after=5s 180s python3 -u "$RUNNER_TEMP/probe.py"
          echo 'Phase 4: initialize the nightly MemFabric URMA engine on device 0'
          cat > "$RUNNER_TEMP/trans.py" <<'PY'
          import signal
          import torch, torch_npu
          import memfabric_hybrid as mf
          engine = mf.TransferEngine()
          print("Beginning URMA initialization", flush=True)
          signal.alarm(75)
          rc = engine.initialize("tcp://127.0.0.1", "127.0.0.1:5200", "Prefill", 0,
                                 mf.TransDataOpType.DEVICE_URMA, "Decode", "")
          signal.alarm(0)
          print("URMA initialize result", rc, flush=True)
          if rc == 0:
              engine.destroy()
          raise SystemExit(int(rc != 0))
          PY
          if ! command -v gdb >/dev/null; then
            apt-get -q update
            DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends gdb
          fi
          export TEST_MF_TRANSPORT_FULL_MESH=1 MF_HYBM_RDMA_USE_HCOMM=0 MF_HYBM_RDMA_USE_AICPU=0
          gdb -nx -batch -ex 'set pagination off' -ex 'handle SIGALRM stop print nopass' -ex run -ex 'thread apply all bt 16' --args python3 -u "$RUNNER_TEMP/trans.py" > "$RUNNER_TEMP/trans-debug.log" 2>&1
          grep -E 'Beginning URMA|URMA initialize|Program received|received signal|ptrace|^#|^Thread [0-9]+ ' "$RUNNER_TEMP/trans-debug.log" | tail -220
          grep -q 'URMA initialize result 0' "$RUNNER_TEMP/trans-debug.log"
