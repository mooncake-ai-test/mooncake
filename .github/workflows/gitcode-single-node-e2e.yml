name: Stop superseded E2E validation
on:
  push:
    branches: [ci/verify-gitcode-single-node-20261124]
permissions:
  actions: write
jobs:
  stop:
    runs-on: ubuntu-latest
    steps:
      - name: Stop the superseded image-package run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          id=45387934416
          url="repos/$GITHUB_REPOSITORY/actions/runs/$id"
          state=$(gh api "$url" --jq '.status')
          if [[ "$state" != completed ]]; then gh api --method POST "$url/cancel"; fi
